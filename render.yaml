envVarGroups:
  - name: threadline-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATABASE_SSL
        value: "true"
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: OAUTH_STATE_TTL_SECONDS
        value: "600"
      - key: OAUTH_CALLBACK_MAX_AGE_SECONDS
        value: "300"
      - key: INGESTION_POLL_INTERVAL_MS
        value: "1000"
      - key: INGESTION_STALE_LOCK_SECONDS
        value: "300"
      - key: INGESTION_MAX_ATTEMPTS
        value: "5"
      - key: INGESTION_BATCH_SIZE
        value: "10"
      - key: INGESTION_BACKOFF_BASE_SECONDS
        value: "5"
      - key: INGESTION_BACKOFF_MAX_SECONDS
        value: "900"
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "false"

services:
  - type: web
    name: threadline-api
    runtime: docker
    plan: starter
    dockerfilePath: ./service/Dockerfile
    dockerContext: ./service
    dockerCommand: npm run start
    preDeployCommand: npm run db:migrate:runtime
    healthCheckPath: /health/ready
    envVars:
      - fromGroup: threadline-shared
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SHOPIFY_SCOPES
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SHOPIFY_OAUTH_CALLBACK_URL
        sync: false
      - key: SHOPIFY_MOBILE_POST_INSTALL_RETURN_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_TOKEN_ENCRYPTION_KEY
        sync: false
  - type: worker
    name: threadline-ingestion-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./service/Dockerfile
    dockerContext: ./service
    dockerCommand: npm run worker
    envVars:
      - fromGroup: threadline-shared
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SHOPIFY_SCOPES
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SHOPIFY_OAUTH_CALLBACK_URL
        sync: false
      - key: SHOPIFY_MOBILE_POST_INSTALL_RETURN_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_TOKEN_ENCRYPTION_KEY
        sync: false
